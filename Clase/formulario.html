<!DOCTYPE html>

<body style="background-image: url('C:\\Users\\LENOVO\\OneDrive - Universidad del rosario\\Escritorio\\Universidad del Rosario\\Septimo Semestre\\DesarrolloWeb\\Clase\\imagenes\\fondo.png');">
    <h1>Contact Form</h1>
    <p>Please fill in your information and we'll be sending your order in no time.</p>
    <form action="ingresar_datos.php" method="post">
        <div>
            <label for="nombre" & for="apellido">Your Name:</label>
            <input type="text" id="nombre" name="nombre"  placeholder="First name">
            <input type="text" id="apellido" name="apellido"  placeholder="Last name">
        </div>

        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email" placeholder="e.g.hello@contact.net"><br><br>

        <label for="telefono">Phone*</label>
        <input type="tel" id="telefono" name="telefono" required placeholder="###-###-####"><br><br>

        <label for="tipo_mensaje">Message subject*</label>
        <select id="tipo_mensaje" name="tipo_mensaje" required>
            <option value="">Other</option>
            <option value="compra">Purchase Inquiry</option>
            <option value="devolucion">Return Request</option>
        </select><br><br>

        <label for="mensaje">Message*</label>
        <textarea id="mensaje" name="mensaje" rows="4" cols="50" required></textarea><br><br>

        <container>
            <label for="verifiacion">Verification*</label>
            <input type="checkbox" id="verificacion" name="verificacion" required placeholder="I'm not a robot"  image="C:\Users\LENOVO\OneDrive - Universidad del rosario\Escritorio\Universidad del Rosario\Septimo Semestre\DesarrolloWeb\Clase\imagenes\captcha.png">
            <p>I'm not a robot</p>
            <image style="width: 40px;" src="C:\Users\LENOVO\OneDrive - Universidad del rosario\Escritorio\Universidad del Rosario\Septimo Semestre\DesarrolloWeb\Clase\imagenes\captcha.png" alt="Captcha Image"><br><br>
        </container>
        <input type="submit" value="SUBMIT FORM">
    </form>
    
</body>
</html>
